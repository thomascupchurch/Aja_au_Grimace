<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project Viewer (v2)</title>
  <style>
  :root { --bg:#4B4B4B; --bg2:#3f3f3f; --panel:#585858; --border:#6a6a6a; --text:#FF8200; --muted:#d1d5db; --brand:#FF8200; --input-bg:#fff; --input-text:#111; }
    body { margin:0; background:var(--bg); color:var(--text); font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; }
    header { display:grid; place-items:center; padding:8px 12px; border-bottom:1px solid var(--border); background: linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%); }
    header img { height: 92px; filter: drop-shadow(0 1px 0 rgba(255,255,255,0.08)) drop-shadow(0 12px 18px rgba(0,0,0,0.55)); }
    .toolbar { display:flex; gap:8px; align-items:center; padding:8px 12px; border-bottom:1px solid var(--border); background: color-mix(in oklab, var(--bg2) 75%, #000 25%); }
  .toolbar select, .toolbar button, .toolbar input { padding:6px 10px; border-radius:6px; border:1px solid #cfcfcf; background:var(--input-bg); color:var(--input-text); }
    .toolbar label { color: var(--brand); font-weight: 600; }
  .toolbar .toggle.on { background: var(--brand); color: #111; border-color: var(--brand); }
    main { min-height:0; display:flex; flex-direction:column; }
    .view { min-height: calc(100vh - 200px); padding: 8px 12px; }
  .empty { color:var(--brand); text-align:center; padding: 16px; }
    table { width:100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 6px 8px; border-bottom: 1px solid var(--border); text-align:left; }
    thead th { position:sticky; top:0; background:var(--bg2); color: var(--brand); border-bottom: 2px solid var(--brand); }
    .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap:10px; }
    .img-card { background:var(--panel); border:1px solid var(--border); border-radius:8px; overflow:hidden; }
    .img-card .wrap { position:relative; padding-top:66%; background:#333; }
    .img-card img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
    .img-card .name { padding:6px 8px; border-top:1px solid var(--border); }
    footer { display:flex; justify-content:center; border-top:1px solid var(--border); padding:6px 12px; color:var(--muted); }
    /* Brand accents in details and dashboard */
    #details b { color: var(--brand); }
    #dash b { color: var(--brand); }
    #dash .section-title { color: var(--brand); font-weight: 600; }
  </style>
</head>
<body>
  <header>
    <img src="/static/header.svg" onerror="this.src='/static/header.png'" alt="Header" />
  </header>
  <div class="toolbar">
    <label>Display:</label>
    <select id="display">
      <option value="gantt">Gantt</option>
      <option value="calendar">Calendar</option>
      <option value="timeline">Timeline</option>
      <option value="tree">Tree</option>
  <option value="images">Images</option>
  <option value="dashboard">Dashboard</option>
  <option value="costs">Costs</option>
      <option value="database">Database</option>
    </select>
    <label id="view-label">View:</label>
    <select id="view">
      <option>Day</option><option>Week</option><option>Month</option><option>Year</option>
    </select>
  <button id="zoom-out" title="Zoom Out">-</button>
  <span id="zoom-label" style="min-width:48px;text-align:center;color:var(--brand);font-weight:600">100%</span>
  <button id="zoom-in" title="Zoom In">+</button>
  <button id="zoom-reset" title="Reset Zoom">Reset</button>
  <label style="margin-left:8px">Deps <input id="toggle-deps" type="checkbox" checked></label>
  <label style="margin-left:8px">Critical <input id="toggle-critical" type="checkbox" checked></label>
  <label style="margin-left:8px">Shade <input id="toggle-shade" type="checkbox" checked></label>
    <button id="refresh">Refresh</button>
    <button id="export-csv" title="Export current view (CSV)">Export CSV</button>
  <button id="export-img" title="Export image">Export…</button>
  <button id="open-details-toolbar" title="Open Full Details" disabled>Details…</button>
  <button id="set-token" title="Set edit token (for saves)">Set Token…</button>
  <span id="token-badge" style="font-size:12px;padding:2px 8px;border-radius:12px;border:1px solid var(--border);color:var(--brand)" title="Edit mode status"></span>
    <label style="margin-left:8px">Status</label>
    <select id="filter-status">
      <option value="">All</option>
      <option>Planned</option>
      <option>In Progress</option>
      <option>Blocked</option>
      <option>Done</option>
      <option>Deferred</option>
    </select>
    <label style="margin-left:8px">Parent</label>
    <select id="filter-parent"><option value="">All</option></select>
  <label style="margin-left:8px"><input id="filter-critical-only" type="checkbox"> Only Critical</label>
  <button id="filter-overdue" class="toggle" title="Show overdue only">Overdue</button>
  <button id="filter-atrisk" class="toggle" title="Show at-risk only">At Risk</button>
  <span id="info" style="margin-left:auto;color:var(--brand);font-size:12px;font-weight:600"></span>
  </div>
  <div id="legend" style="display:flex;gap:12px;align-items:center;padding:6px 12px;border-bottom:1px solid var(--border);font-size:12px;color:var(--brand)">
    <span style="font-weight:700;letter-spacing:.3px">Legend</span>
    <span style="display:inline-flex;align-items:center;gap:6px"><span style="display:inline-block;width:14px;height:10px;background:#333;border-radius:3px"></span> Bar</span>
    <span style="display:inline-flex;align-items:center;gap:6px"><span style="display:inline-block;width:14px;height:10px;background:#FF8200;border-radius:3px"></span> Progress</span>
    <span style="display:inline-flex;align-items:center;gap:6px"><span style="display:inline-block;width:14px;height:10px;background:#DAA520;border-radius:3px"></span> Critical</span>
    <span style="display:inline-flex;align-items:center;gap:6px"><span style="display:inline-block;width:14px;height:10px;border:2px solid red;border-radius:3px"></span> Overdue</span>
    <span style="display:inline-flex;align-items:center;gap:6px"><span style="display:inline-block;width:14px;height:10px;border:2px solid #FFA500;border-radius:3px"></span> At Risk</span>
    <span style="display:inline-flex;align-items:center;gap:6px">
      <svg width="22" height="10"><path d="M1 5 L11 5 L11 5 L21 5" stroke="#FFAA28" fill="none"/></svg> Dependency
    </span>
  </div>
  <main style="display:grid; grid-template-columns: 1fr 360px; gap: 8px; align-items: start;">
    <section id="gantt-view" class="view" style="grid-column:1 / 2;"></section>
    <section id="calendar-view" class="view" hidden></section>
    <section id="timeline-view" class="view" hidden></section>
    <section id="tree-view" class="view" hidden></section>
    <section id="dashboard-view" class="view" hidden>
      <div id="dash"></div>
    </section>
    <section id="costs-view" class="view" hidden>
      <div id="costs" style="overflow:auto;max-height:70vh"></div>
    </section>
    <section id="images-view" class="view" hidden>
      <input id="img-filter" placeholder="Filter images..." />
      <div id="images" class="grid"></div>
    </section>
    <section id="db-view" class="view" hidden>
      <input id="db-filter" placeholder="Filter by Project Part/Parent..." />
      <div id="db" style="overflow:auto;max-height:70vh"></div>
    </section>
    <aside id="details" style="grid-column:2 / 3; position:sticky; top:8px; max-height: calc(100vh - 220px); overflow:auto; background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:8px;">
      <div style="font-weight:600; margin-bottom:6px; color:var(--brand); display:flex; align-items:center; gap:6px;">
        <span style="display:inline-block;width:6px;height:6px;background:var(--brand);border-radius:2px"></span>
        Details
      </div>
      <div id="details-body" class="empty">Select a task or row</div>
    </aside>
  </main>
  <!-- Export modal -->
  <dialog id="export-dialog" style="border:1px solid var(--border);background:var(--bg2);color:var(--text);border-radius:8px;padding:12px;">
    <form method="dialog">
      <div style="font-weight:600;margin-bottom:8px">Export Gantt</div>
      <div style="display:grid;grid-template-columns:140px 1fr;gap:8px;align-items:center;">
        <label>Format</label>
        <select id="exp-format"><option>SVG</option><option>PNG</option></select>
        <label>Scale</label>
        <input id="exp-scale" type="number" min="0.25" max="4" step="0.25" value="1" />
        <label>Background</label>
        <select id="exp-bg"><option value="#ffffff">White</option><option value="transparent">Transparent</option><option value="#4B4B4B">Dark</option></select>
        <label>Filename</label>
        <input id="exp-name" value="gantt_export" />
    <label>Paper</label>
        <select id="exp-paper"><option value="">None</option><option value="letter">Letter (8.5×11in)</option><option value="a4">A4 (210×297mm)</option></select>
        <label>Orientation</label>
        <select id="exp-orient"><option>Portrait</option><option>Landscape</option></select>
        <label>Margin (mm)</label>
  <input id="exp-margin" type="number" min="0" max="50" step="1" value="10" />
  <label>Header Title</label>
  <input id="exp-title" placeholder="e.g., Project Gantt" />
  <label>Header Date</label>
  <input id="exp-date" placeholder="e.g., 2025-10-13" />
  <label>Page Number</label>
  <input id="exp-page" placeholder="e.g., 1 of 1" />
      </div>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px;">
        <button value="cancel">Cancel</button>
        <button id="exp-run" value="default">Export</button>
      </div>
    </form>
  </dialog>
  <!-- Edit modal -->
  <dialog id="edit-dialog" style="border:1px solid var(--border);background:var(--bg2);color:var(--text);border-radius:8px;padding:12px;max-width:720px;width:90vw;">
    <form method="dialog">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
        <div id="edit-title" style="font-weight:700;color:var(--brand);flex:1">Edit</div>
        <button value="cancel">Close</button>
      </div>
      <div style="display:grid;grid-template-columns:180px 1fr;gap:8px;align-items:center" id="edit-form">
        <label>% Complete</label>
        <input id="ed-pct" type="number" min="0" max="100" step="1" />
        <label>Status</label>
        <select id="ed-status">
          <option>Planned</option><option>In Progress</option><option>Blocked</option><option>Done</option><option>Deferred</option>
        </select>
        <label>Start Date (mm-dd-yyyy)</label>
        <input id="ed-start" placeholder="mm-dd-yyyy" />
        <label>Duration (days)</label>
        <input id="ed-dur" type="number" step="1" />
        <label>Type</label>
        <input id="ed-type" />
        <label>Internal/External</label>
        <input id="ed-intext" />
        <label>Responsible</label>
        <input id="ed-resp" />
        <label>Dependencies (comma sep)</label>
        <input id="ed-deps" />
        <label>Pace Link</label>
        <input id="ed-pace" />
        <label>Notes</label>
        <textarea id="ed-notes" rows="4" style="resize:vertical"></textarea>
      </div>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px;align-items:center">
        <span id="edit-hint" style="font-size:12px;color:#bbb"></span>
        <button id="ed-save" value="default">Save Changes</button>
      </div>
    </form>
  </dialog>
  <!-- Full Details modal -->
  <dialog id="details-dialog" style="border:1px solid var(--border);background:var(--bg2);color:var(--text);border-radius:8px;padding:12px;max-width:900px;width:90vw;">
    <form method="dialog">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
        <div style="font-weight:700;color:var(--brand);flex:1">Project Part Details</div>
        <button value="cancel">Close</button>
      </div>
      <div id="details-dialog-body" style="max-height:70vh;overflow:auto"></div>
    </form>
  </dialog>
  <footer><span>{{ watermark }}</span></footer>
  <script>
  let tasks = null, dbdata = null, images = null, metrics = null, costs = null, mode = 'gantt', selected = null;
  const detailsBtn = document.getElementById('open-details-toolbar');
  if(detailsBtn){ detailsBtn.addEventListener('click', ()=>{ if(selected) openFullDetails(); }); }
  // Edit token handling
  const TKEY = 'editToken';
  function getToken(){ return (localStorage.getItem(TKEY)||'').trim(); }
  function setToken(tok){ if(tok==null) return; const t=String(tok).trim(); if(t){ localStorage.setItem(TKEY, t); } else { localStorage.removeItem(TKEY); } updateTokenBadge(); }
  function updateTokenBadge(){ const b=document.getElementById('token-badge'); if(!b) return; const t=getToken(); if(t){ b.textContent='Edit: On'; b.style.borderColor='#22c55e'; b.style.color='#22c55e'; } else { b.textContent='Edit: Off'; b.style.borderColor='var(--border)'; b.style.color='var(--brand)'; } }
  document.getElementById('set-token')?.addEventListener('click', ()=>{ const cur=getToken(); const v=prompt('Enter edit token (leave empty to clear):', cur); if(v===null) return; setToken(v||''); });
  // Utils: copy to clipboard and linkify
  async function copyText(txt){ try { await navigator.clipboard.writeText(String(txt||'')); } catch(_){ const ta=document.createElement('textarea'); ta.value=String(txt||''); document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); }catch(_){ } ta.remove(); } }
  function linkify(text){ const s = String(text||''); const esc = escapeHtml(s); const re = /(https?:\/\/[^\s<]+[^<.,:;"')\]\s])/g; return esc.replace(re, '<a href="$1" target="_blank" rel="noopener nofollow">$1<\/a>'); }
  // Zoom state (persisted)
  const ZKEY = 'ganttZoomPct';
  let zoomPct = parseInt(localStorage.getItem(ZKEY) || '100', 10);
  function clampZoom(p){ return Math.max(25, Math.min(300, p)); }
  function setZoom(p){ zoomPct = clampZoom(p); localStorage.setItem(ZKEY, String(zoomPct)); document.getElementById('zoom-label').textContent = zoomPct + '%'; refresh(); }
  document.getElementById('zoom-in').addEventListener('click', ()=> setZoom(zoomPct + 10));
  document.getElementById('zoom-out').addEventListener('click', ()=> setZoom(zoomPct - 10));
  document.getElementById('zoom-reset').addEventListener('click', ()=> setZoom(100));
  document.getElementById('zoom-label').textContent = zoomPct + '%';
  // Toggles
  const elDeps = document.getElementById('toggle-deps');
  const elCrit = document.getElementById('toggle-critical');
  const elShade = document.getElementById('toggle-shade');
  [elDeps, elCrit, elShade].forEach(el=> el.addEventListener('change', ()=> refresh()));
  // Keyboard zoom + Ctrl+wheel
  window.addEventListener('keydown', (e)=>{
    if((e.ctrlKey||e.metaKey) && (e.key==='='||e.key==='+')){ e.preventDefault(); setZoom(zoomPct+10); }
    else if((e.ctrlKey||e.metaKey) && (e.key==='-')){ e.preventDefault(); setZoom(zoomPct-10); }
    else if((e.ctrlKey||e.metaKey) && (e.key==='0')){ e.preventDefault(); setZoom(100); }
  });
  window.addEventListener('wheel', (e)=>{ if(e.ctrlKey){ e.preventDefault(); setZoom(zoomPct + (e.deltaY<0? 5 : -5)); } }, {passive:false});
    document.getElementById('display').addEventListener('change', (e) => setMode(e.target.value));
    document.getElementById('refresh').addEventListener('click', () => refresh());
    document.getElementById('view').addEventListener('change', () => {
      if(mode==='gantt' || mode==='timeline' || mode==='calendar') refresh();
    });
  document.getElementById('export-csv').addEventListener('click', () => exportCsv());
    document.getElementById('img-filter').addEventListener('input', () => renderImages());
    document.getElementById('db-filter').addEventListener('input', () => renderDb());
  // Filters
  document.getElementById('filter-status').addEventListener('change', ()=> refresh());
  document.getElementById('filter-parent').addEventListener('change', ()=> refresh());
  document.getElementById('filter-critical-only').addEventListener('change', ()=> refresh());
  const fOverdue = document.getElementById('filter-overdue');
  const fAtRisk = document.getElementById('filter-atrisk');
  fOverdue.addEventListener('click', ()=>{ fOverdue.classList.toggle('on'); if(fOverdue.classList.contains('on')) fAtRisk.classList.remove('on'); refresh(); });
  fAtRisk.addEventListener('click', ()=>{ fAtRisk.classList.toggle('on'); if(fAtRisk.classList.contains('on')) fOverdue.classList.remove('on'); refresh(); });

    function setMode(m){ mode = m; const ids=['gantt','calendar','timeline','tree','images','db'];
      document.getElementById('gantt-view').hidden = m!=='gantt';
      document.getElementById('calendar-view').hidden = m!=='calendar';
      document.getElementById('timeline-view').hidden = m!=='timeline';
      document.getElementById('tree-view').hidden = m!=='tree';
      document.getElementById('images-view').hidden = m!=='images';
      document.getElementById('db-view').hidden = m!=='database';
      document.getElementById('dashboard-view').hidden = m!=='dashboard';
      document.getElementById('costs-view').hidden = m!=='costs';
      const viewSel = document.getElementById('view');
  const viewLbl = document.getElementById('view-label'); viewLbl.style.color = 'var(--brand)'; viewLbl.style.fontWeight='600';
      const showView = (m==='gantt' || m==='calendar' || m==='timeline');
      viewSel.style.display = showView ? '' : 'none';
      viewLbl.style.display = showView ? '' : 'none';
      refresh();
    }

    async function refresh(){
      const info = document.getElementById('info');
      try{
        const dbg = await fetch('/api/debug').then(r=>r.json());
        info.textContent = `DB: ${dbg.db_path||'?'} | rows: ${dbg.row_count}`;
      }catch(_){ info.textContent=''; }
      if(mode==='images') return renderImages(true);
      if(mode==='database') return renderDb(true);
      if(mode==='dashboard') return renderDashboard(true);
      if(mode==='costs') return renderCosts(true);
      return loadTasks();
    }

    function dateToX(d0, d, scaleDays, pxPerDay){
      const t0 = new Date(d0 + 'T00:00:00Z'); const t = new Date(d + 'T00:00:00Z');
      const dt = (t - t0) / (1000*60*60*24); return dt * pxPerDay;
    }
    function addShading(svg, t0, t1, padL, pxPerDay, h){
      // Shade weekends and common US holidays
      const ns = svg.namespaceURI; const start = new Date(t0+'T00:00:00'); const end = new Date(t1+'T00:00:00');
      // Weekends
      for(let d=new Date(start); d<=end; d=new Date(d.getTime()+86400000)){
        const dow = d.getDay(); // 0 Sun..6 Sat
        if(dow===0 || dow===6){
          const x = padL + dateToX(t0, d.toISOString().slice(0,10), 1, pxPerDay);
          const r = document.createElementNS(ns,'rect'); r.setAttribute('x', x); r.setAttribute('y', 0); r.setAttribute('width', Math.max(1, pxPerDay)); r.setAttribute('height', h);
          r.setAttribute('fill', '#dcdcdc'); r.setAttribute('fill-opacity','0.28'); r.setAttribute('stroke','none'); svg.appendChild(r);
        }
      }
      // Holidays (approx US federal)
      const holSet = buildHolidays(start.getFullYear(), end.getFullYear());
      holSet.forEach(iso=>{
        const d = new Date(iso+'T00:00:00'); if(d<start||d>end) return;
        const x = padL + dateToX(t0, iso, 1, pxPerDay);
        const r = document.createElementNS(ns,'rect'); r.setAttribute('x', x); r.setAttribute('y', 0); r.setAttribute('width', Math.max(1, pxPerDay)); r.setAttribute('height', h);
        r.setAttribute('fill', '#FFD700'); r.setAttribute('fill-opacity','0.18'); r.setAttribute('stroke','none'); svg.appendChild(r);
      });
    }
    function buildHolidays(yStart, yEnd){
      const out = new Set();
      for(let y=yStart; y<=yEnd; y++){
        const iso=(d)=> d.toISOString().slice(0,10);
        const nthDow = (n, dow, m)=>{ const d=new Date(y,m,1); const add=(dow - d.getDay() + 7)%7; d.setDate(1+add + (n-1)*7); return d; };
        const lastDow = (dow, m)=>{ const d=new Date(y,m+1,0); const sub=(d.getDay()-dow+7)%7; d.setDate(d.getDate()-sub); return d; };
        out.add(`${y}-01-01`); // New Year
        out.add(iso(nthDow(3,1,0))); // MLK 3rd Mon Jan
        out.add(iso(nthDow(3,1,1))); // Presidents 3rd Mon Feb
        out.add(iso(lastDow(1,4))); // Memorial last Mon May
        out.add(`${y}-07-04`); // Independence
        out.add(iso(nthDow(1,1,8))); // Labor 1st Mon Sep
        out.add(iso(nthDow(2,1,9))); // Indigenous/Columbus 2nd Mon Oct
        out.add(`${y}-11-11`); // Veterans
        // Thanksgiving: 4th Thu Nov
        const tg = nthDow(4,4,10); out.add(iso(tg));
        out.add(`${y}-12-25`); // Christmas
      }
      return out;
    }
    function addTickLines(svg, t0, t1, padL, pxPerDay, h){
      const ns = svg.namespaceURI; const g = document.createElementNS(ns,'g');
      const d0 = new Date(t0+'T00:00:00'); const d1 = new Date(t1+'T00:00:00');
      const view = document.getElementById('view').value;
      // choose step: Day/Week/Month/Year
      let stepDays = 1; if(view==='Week') stepDays=7; else if(view==='Month') stepDays=30; else if(view==='Year') stepDays=365;
      let cur = new Date(d0);
      const lbl = (dt)=>{
        const y=dt.getFullYear(), m=String(dt.getMonth()+1).padStart(2,'0'), d=String(dt.getDate()).padStart(2,'0');
        if(view==='Day') return `${m}/${d}`; if(view==='Week') return `Wk ${getWeek(dt)}`; if(view==='Month') return `${m}/${y%100}`; return `${y}`;
      };
      function fmtISO(dt){ return dt.toISOString().slice(0,10); }
      function getWeek(dt){ const onejan = new Date(dt.getFullYear(),0,1); return Math.ceil((((dt - onejan) / 86400000) + onejan.getDay()+1)/7); }
      while(cur <= d1){
        const x = padL + dateToX(t0, fmtISO(cur), 1, pxPerDay);
        const line = document.createElementNS(ns,'line'); line.setAttribute('x1',x); line.setAttribute('x2',x); line.setAttribute('y1',0); line.setAttribute('y2',h);
        line.setAttribute('stroke','#374151'); line.setAttribute('stroke-width','1'); g.appendChild(line);
  const text = document.createElementNS(ns,'text'); text.setAttribute('x', x+4); text.setAttribute('y', 14);
  text.setAttribute('fill','#FF8200'); text.setAttribute('font-size','11'); text.setAttribute('font-weight','600'); text.textContent = lbl(cur);
        g.appendChild(text);
        cur = new Date(cur.getTime() + stepDays*24*60*60*1000);
      }
      // Today marker
      const today = new Date(); const xToday = padL + dateToX(t0, today.toISOString().slice(0,10), 1, pxPerDay);
      if(xToday >= padL && xToday <= parseFloat(svg.getAttribute('width')||'0')){
        const tl = document.createElementNS(ns,'line'); tl.setAttribute('x1', xToday); tl.setAttribute('x2', xToday); tl.setAttribute('y1', 0); tl.setAttribute('y2', h);
        tl.setAttribute('stroke','#ef4444'); tl.setAttribute('stroke-width','1.5'); tl.setAttribute('stroke-dasharray','4,4'); g.appendChild(tl);
      }
      svg.appendChild(g);
    }
    function pxPerDayForView(){
      const v = document.getElementById('view').value;

    function openEditDialog(task){
      const raw = task.raw||{}; const dlg = document.getElementById('edit-dialog');
      document.getElementById('edit-title').textContent = `Edit: ${task.name||task.id||''}`;
      // Prefill
      function val(k, fallback=''){ const v = raw[k]; return (v==null||v==='') ? fallback : String(v); }

      document.getElementById('ed-start').value = val('Start Date','');

      document.getElementById('ed-intext').value = String(task.internal_external || val('Internal/External',''));
      document.getElementById('ed-resp').value = String(val('Responsible',''));
      document.getElementById('ed-deps').value = String(raw['Dependencies']||'');
      document.getElementById('ed-pace').value = String(val('Pace Link',''));
      document.getElementById('ed-notes').value = String(val('Notes',''));
      document.getElementById('edit-hint').textContent = getToken()? '' : 'Tip: Set an edit token to enable saving';
      dlg.showModal();
      // Wire save (one-shot)
      const btn = document.getElementById('ed-save');
      const handler = async (e)=>{
        e.preventDefault();
        const tok = getToken();
        if(!tok){ alert('No edit token set. Click "Set Token…" in the toolbar.'); return; }
        const updates = {
          '% Complete': String(document.getElementById('ed-pct').value||'').trim(),
          'Status': String(document.getElementById('ed-status').value||'').trim(),
          'Start Date': String(document.getElementById('ed-start').value||'').trim(),
          'Duration (days)': String(document.getElementById('ed-dur').value||'').trim(),
          'Type': String(document.getElementById('ed-type').value||'').trim(),
          'Internal/External': String(document.getElementById('ed-intext').value||'').trim(),
          'Responsible': String(document.getElementById('ed-resp').value||'').trim(),
          'Dependencies': String(document.getElementById('ed-deps').value||'').trim(),
          'Pace Link': String(document.getElementById('ed-pace').value||'').trim(),
          'Notes': String(document.getElementById('ed-notes').value||'').trim(),
        };
        // Remove empty keys to avoid overwriting with blanks unless explicitly set
        Object.keys(updates).forEach(k=>{ if(updates[k]==='') delete updates[k]; });
        if(Object.keys(updates).length===0){ alert('No changes to save.'); dlg.close(); return; }
        try{
          const res = await fetch('/api/task/update', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ edit_token: tok, project_part: task.name, updates }) });
          if(!res.ok){ const txt = await res.text(); throw new Error(`${res.status} ${res.statusText} - ${txt}`); }
          const j = await res.json();
          if(!j.ok){ throw new Error('Save failed'); }
          // Queue reselection and refresh
          window._pendSelectName = task.name;
          tasks = null; // force reload
          await refresh();
          dlg.close();
        }catch(err){ alert(`Save failed: ${err}`); }
      };
      btn.addEventListener('click', handler, { once: true });
    }

          if(rect){
            const s = document.createElementNS(tsvg.namespaceURI,'rect'); s.setAttribute('id','sel-highlight');
            const x=parseFloat(rect.getAttribute('x')||'0'), y=parseFloat(rect.getAttribute('y')||'0'); const w=parseFloat(rect.getAttribute('width')||'0'), h=parseFloat(rect.getAttribute('height')||'0');
            s.setAttribute('x', String(x-2)); s.setAttribute('y', String(y-2)); s.setAttribute('width', String(w+4)); s.setAttribute('height', String(h+4));
            s.setAttribute('rx', 6); s.setAttribute('fill','none'); s.setAttribute('stroke', 'var(--brand)'); s.setAttribute('stroke-width','2.5');
            tsvg.appendChild(s);
          }
        }
      }
    }

    function exportCsv(){
      if(mode==='database' && dbdata){
        const cols = dbdata.columns||[]; const rows = dbdata.rows||[];
        const csv = [cols.map(csvCell).join(',')].concat(rows.map(r=>cols.map(c=>csvCell(r[c])).join(','))).join('\n');
        downloadText('database.csv', csv);
      } else if(mode==='dashboard' && metrics){
        const m = metrics; const rows = Object.entries(m.status_counts||{}).map(([st,c])=>({Status:st, Count:c, PctOfLeaf: (c/(m.leaf_count||1)*100).toFixed(1)}));
        const cols = ['Status','Count','PctOfLeaf'];
        const csv = [cols.join(',')].concat(rows.map(r=>cols.map(c=>csvCell(r[c])).join(','))).join('\n');
        downloadText('dashboard_status.csv', csv);
      } else if(mode==='costs' && costs){
        const cols = costs.columns||[]; const rows = costs.rows||[];
        const csv = [cols.join(',')].concat(rows.map(r=>cols.map(c=>csvCell(r[c])).join(','))).join('\n');
        downloadText('costs.csv', csv);
      } else if(selected && selected.type==='task'){
        const t = selected.data; const raw = t.raw||{}; const cols = Object.keys(raw);
        const csv = [cols.map(csvCell).join(',')].concat([[cols.map(c=>csvCell(raw[c])).join(',')]]).join('\n');
        downloadText('task_raw.csv', csv);
      }
    }

    // Export image/dialog
    document.getElementById('export-img').addEventListener('click', ()=>{
      if(mode!=='gantt'){ alert('Switch to Gantt to export.'); return; }
      document.getElementById('export-dialog').showModal();
    });
    // Export include footer option
    const EXP_FOOT_ID = 'exp-include-footer';
    if(!document.getElementById(EXP_FOOT_ID)){
      const dlg = document.getElementById('export-dialog');
      const ins = document.createElement('div'); ins.style.marginTop='8px';
      ins.innerHTML = `<label><input id='${EXP_FOOT_ID}' type='checkbox' checked> Include footer note</label>`;
      dlg.querySelector('form').insertBefore(ins, dlg.querySelector('form').lastElementChild);
    }
    document.getElementById('exp-run').addEventListener('click', async (e)=>{
      e.preventDefault();
      const fmt = document.getElementById('exp-format').value;
      const scale = parseFloat(document.getElementById('exp-scale').value||'1');
      const bg = document.getElementById('exp-bg').value;
      const name = (document.getElementById('exp-name').value||'gantt_export').replace(/[^A-Za-z0-9_\-]/g,'_');
      const paper = (document.getElementById('exp-paper').value||'').toLowerCase();
      const orient = (document.getElementById('exp-orient').value||'Portrait').toLowerCase();
      const marginMm = parseFloat(document.getElementById('exp-margin').value||'10');
      const hdrTitle = (document.getElementById('exp-title')?.value||'').trim();
      const hdrDate = (document.getElementById('exp-date')?.value||'').trim();
      const hdrPage = (document.getElementById('exp-page')?.value||'').trim();
      const dpi = 96; const mmToPx = (mm)=> (mm/25.4)*dpi;
      async function loadLogo(){
        try{
          const urls = ['/static/header.svg','/static/header.png'];
          for(const u of urls){
            const r = await fetch(u);
            if(!r.ok) continue;
            const b = await r.blob();
            const dataUrl = await new Promise(resolve=>{ const fr=new FileReader(); fr.onload=()=>resolve(fr.result); fr.readAsDataURL(b); });
            const img = await new Promise(resolve=>{ const im=new Image(); im.onload=()=>resolve(im); im.src=String(dataUrl); });
            return { img, dataUrl: String(dataUrl), w: img.width||100, h: img.height||40 };
          }
        }catch(_){ /* ignore */ }
        return null;
      }
      function paperDimsPx(){
        if(!paper) return null;
        if(paper==='letter'){ let w=8.5*dpi, h=11*dpi; if(orient==='landscape') [w,h]=[h,w]; return {w:Math.round(w), h:Math.round(h)}; }
        if(paper==='a4'){ const wmm=210, hmm=297; let w=mmToPx(wmm), h=mmToPx(hmm); if(orient==='landscape') [w,h]=[h,w]; return {w:Math.round(w), h:Math.round(h)}; }
        return null;
      }
      const host = document.getElementById('gantt-view'); const svg = host.querySelector('svg');
      if(!svg){ alert('Nothing to export'); return; }
      const watermark = document.querySelector('footer span')?.textContent || '';
      const includeFooter = document.getElementById(EXP_FOOT_ID).checked;
  const logo = await loadLogo();
  if(fmt==='SVG'){
        // Build an output SVG possibly sized to paper with margins
        const contentW = parseFloat(svg.getAttribute('width')||'0');
        const contentH = parseFloat(svg.getAttribute('height')||'0');
        const dims = paperDimsPx();
        const out = document.createElementNS(svg.namespaceURI,'svg');
        let outW = contentW, outH = contentH, footerH = includeFooter ? 24 : 0;
        let marginPx = mmToPx(marginMm);
        if(dims){ outW = dims.w; outH = dims.h; } else { marginPx = 0; }
        out.setAttribute('width', String(outW)); out.setAttribute('height', String(outH));
        const g = document.createElementNS(svg.namespaceURI,'g');
  const fitW = Math.max(1, outW - 2*marginPx);
  const logoH = 20; const logoW = logo ? Math.round((logo.w/Math.max(1,logo.h)) * logoH) : 0;
  const headerH = (hdrTitle || hdrDate || hdrPage || logo) ? Math.max(28, logo ? (logoH+10) : 28) : 0;
        const fitH = Math.max(1, outH - 2*marginPx - footerH - headerH);
        const sX = fitW / contentW, sY = fitH / contentH; const s = (dims ? Math.min(sX, sY) : scale);
        g.setAttribute('transform', `translate(${marginPx},${marginPx + headerH}) scale(${s})`);
        // BG
        if(bg && bg!=='transparent'){
          const rect = document.createElementNS(svg.namespaceURI,'rect');
          rect.setAttribute('x','0'); rect.setAttribute('y','0'); rect.setAttribute('width', String(outW)); rect.setAttribute('height', String(outH)); rect.setAttribute('fill', bg);
          out.appendChild(rect);
        }
        if(headerH){
          let leftX = marginPx + 4; const hy = marginPx + 16;
          if(logo){
            const imgEl = document.createElementNS(svg.namespaceURI,'image');
            imgEl.setAttributeNS('http://www.w3.org/1999/xlink','href', logo.dataUrl);
            imgEl.setAttribute('x', String(leftX));
            imgEl.setAttribute('y', String(marginPx + Math.max(2, Math.floor((headerH - logoH)/2))));
            imgEl.setAttribute('width', String(logoW));
            imgEl.setAttribute('height', String(logoH));
            out.appendChild(imgEl);
            leftX += logoW + 8;
          }
          if(hdrTitle){ const t = document.createElementNS(svg.namespaceURI,'text'); t.textContent = hdrTitle; t.setAttribute('x', String(leftX)); t.setAttribute('y', String(hy)); t.setAttribute('fill', '#FF8200'); t.setAttribute('font-size','14'); t.setAttribute('font-weight','600'); out.appendChild(t); }
          let rightText = '';
          if(hdrDate) rightText += hdrDate;
          if(hdrPage) rightText += (rightText? ' · ' : '') + hdrPage;
          if(rightText){ const t2 = document.createElementNS(svg.namespaceURI,'text'); t2.textContent = rightText; t2.setAttribute('x', String(outW - marginPx - Math.max(80, rightText.length*7))); t2.setAttribute('y', String(hy)); t2.setAttribute('fill', '#FF8200'); t2.setAttribute('font-size','12'); out.appendChild(t2); }
        }
        const clonedInner = svg.cloneNode(true);
        g.appendChild(clonedInner); out.appendChild(g);
        if(includeFooter){
          const textEl = document.createElementNS(svg.namespaceURI,'text'); textEl.textContent = watermark;
          textEl.setAttribute('x', String(Math.max(4, outW/2 - watermark.length*3)));
          textEl.setAttribute('y', String(outH - 6)); textEl.setAttribute('fill','#bbb'); textEl.setAttribute('font-size','12');
          out.appendChild(textEl);
        }
        const ser = new XMLSerializer(); const xml = ser.serializeToString(out);
        downloadText(name + '.svg', xml);
      } else {
        // PNG via canvas
    let contentW = parseFloat(svg.getAttribute('width')||'0');
        let contentH = parseFloat(svg.getAttribute('height')||'0');
    const logoH = 20; const logoW = logo ? Math.round((logo.w/Math.max(1,logo.h)) * logoH) : 0;
    const headerH = (hdrTitle || hdrDate || hdrPage || logo) ? Math.max(28, logo ? (logoH+10) : 28) : 0;
    const extraH = (includeFooter ? 24 : 0) + headerH;
        const dims = paperDimsPx();
        let outW = contentW, outH = contentH + extraH;
        let marginPx = mmToPx(marginMm);
        if(dims){ outW = dims.w; outH = dims.h; } else { marginPx = 0; }
        const ser = new XMLSerializer(); const svgStr = ser.serializeToString(svg);
        const img = new Image(); const blob = new Blob([svgStr], {type: 'image/svg+xml;charset=utf-8'});
        const url = URL.createObjectURL(blob);
        img.onload = function(){
          const canvas = document.createElement('canvas'); canvas.width = Math.ceil(outW); canvas.height = Math.ceil(outH);
          const ctx = canvas.getContext('2d');
          if(bg && bg!=='transparent'){ ctx.fillStyle = bg; ctx.fillRect(0,0,canvas.width,canvas.height); }
          const fitW = Math.max(1, outW - 2*marginPx);
          const fitH = Math.max(1, outH - 2*marginPx - extraH);
          const sX = fitW / contentW, sY = fitH / contentH; const s = dims ? Math.min(sX, sY) : scale;
          ctx.setTransform(s, 0, 0, s, marginPx, marginPx + headerH);
          ctx.drawImage(img, 0, 0, contentW, contentH);
          if(headerH){
            ctx.setTransform(1,0,0,1,0,0);
            let leftX = marginPx + 4; const baseY = marginPx + 16;
            if(logo){ ctx.drawImage(logo.img, leftX, marginPx + Math.max(2, Math.floor((headerH - logoH)/2)), logoW, logoH); leftX += logoW + 8; }
            ctx.fillStyle = '#FF8200';
            if(hdrTitle){ ctx.font = '600 14px sans-serif'; ctx.fillText(hdrTitle, leftX, baseY); }
            const rightText = [hdrDate, hdrPage].filter(Boolean).join(' · ');
            if(rightText){ ctx.font = '12px sans-serif'; const tw = ctx.measureText(rightText).width; ctx.fillText(rightText, outW - marginPx - tw - 4, marginPx + 16); }
          }
          if(includeFooter){ ctx.setTransform(1,0,0,1,0,0); ctx.fillStyle = '#bbb'; ctx.font = `12px sans-serif`; ctx.fillText(watermark, 8, outH - 8); }
          URL.revokeObjectURL(url);
          canvas.toBlob((png)=>{ const dl = document.createElement('a'); dl.href = URL.createObjectURL(png); dl.download = name + '.png'; document.body.appendChild(dl); dl.click(); setTimeout(()=>{ URL.revokeObjectURL(dl.href); dl.remove(); }, 0); }, 'image/png');
        };
        img.onerror = function(){ URL.revokeObjectURL(url); alert('Failed to render PNG'); };
        img.src = url;
      }
      document.getElementById('export-dialog').close();
    });

    function csvCell(v){ if(v==null) return ''; const s = String(v).replaceAll('"','""'); return '"'+s+'"'; }
    function downloadText(name, text){ const blob = new Blob([text], {type:'text/csv;charset=utf-8;'}); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 0); }
    function escapeHtml(s){ return s.replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c])); }

    // initial
    setMode('gantt');
    updateDetailsButton();
    updateTokenBadge();
  </script>
</body>
</html>
